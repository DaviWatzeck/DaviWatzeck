<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Davi Watzeck — Full-Stack Developer</title>
  <desc id="desc">Banner escuro com detalhes azuis para o perfil profissional de Davi Watzeck.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#07111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#20d6f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#148cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#148cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#88a4c4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="1015" cy="180" rx="360" ry="300" fill="url(#glow)"/>
  <path d="M0 332H1200" stroke="url(#accent)" stroke-width="3" opacity="0.85"/>

  <g opacity="0.85">
    <path d="M880 88h86l26 26h118" fill="none" stroke="#20d6f7" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M845 248h105l22-22h148" fill="none" stroke="#1677ff" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M948 170h154" fill="none" stroke="#81a5d8" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="880" cy="88" r="5" fill="#20d6f7" filter="url(#softGlow)"/>
    <circle cx="1110" cy="114" r="5" fill="#20d6f7"/>
    <circle cx="845" cy="248" r="5" fill="#1677ff" filter="url(#softGlow)"/>
    <circle cx="1120" cy="226" r="5" fill="#1677ff"/>
    <circle cx="948" cy="170" r="4" fill="#8aa9d4"/>
    <circle cx="1102" cy="170" r="4" fill="#8aa9d4"/>
  </g>

  <g transform="translate(72 78)">
    <rect x="0" y="0" width="8" height="132" rx="4" fill="url(#accent)"/>
    <text x="36" y="40" fill="#93a4bb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">ENGINEERING · AUTOMATION · B2B</text>
    <text x="32" y="105" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">DAVI WATZECK</text>
    <text x="34" y="151" fill="#c7d2e3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500">Full-Stack Developer</text>
    <text x="34" y="193" fill="#7f92aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Sistemas web confiáveis para operações complexas.</text>
  </g>

  <g transform="translate(940 139)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 12 8 40l28 28" stroke="#20d6f7" stroke-width="7"/>
    <path d="m92 12 28 28-28 28" stroke="#1677ff" stroke-width="7"/>
    <path d="m76 0-24 80" stroke="#dce8f8" stroke-opacity="0.75" stroke-width="6"/>
  </g>
</svg>
